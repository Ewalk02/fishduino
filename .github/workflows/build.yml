name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fishduino_target: [4in, 7b]
    steps:
      - uses: actions/checkout@v4

      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.4

      - name: Build firmware (${{ matrix.fishduino_target }})
        run: |
          ./scripts/build-target.sh "${{ matrix.fishduino_target }}"
          grep -q 'CONFIG_PARTITION_TABLE_CUSTOM=y' sdkconfig
          grep -q 'CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y' sdkconfig
          if [[ "${{ matrix.fishduino_target }}" == "4in" ]]; then
            grep -q 'CONFIG_FISHDUINO_BOARD_4IN=y' sdkconfig
            grep -q 'CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y' sdkconfig
          else
            grep -q 'CONFIG_FISHDUINO_BOARD_7B=y' sdkconfig
            grep -q 'CONFIG_ESPTOOLPY_FLASHSIZE_32MB=y' sdkconfig
          fi
