name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.4

      - name: Build firmware
        run: |
          # Fresh CI uses sdkconfig.defaults (16 MB flash, custom partitions.csv for OTA).
          rm -f sdkconfig
          idf.py set-target esp32p4
          grep -q 'CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y' sdkconfig
          grep -q 'CONFIG_PARTITION_TABLE_CUSTOM=y' sdkconfig
          grep -q 'CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y' sdkconfig
          idf.py build
